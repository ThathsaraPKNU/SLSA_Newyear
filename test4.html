<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Elephant Eye Coordinates</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #coord-display {
            font-size: 1.2rem;
            color: #39ff14;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }
        #game-container {
            position: relative;
            width: 92vw;
            max-width: 600px;
            height: 50vh;
            max-height: 450px;
            background: #fff url('image_2.png') no-repeat center;
            background-size: contain;
            border: 4px solid #333;
            border-radius: 20px;
            cursor: crosshair;
        }
        /* පරික්ෂා කිරීම සඳහා තාවකාලික රතු ලක්ෂ්‍යයක් */
        #test-pointer {
            position: absolute;
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>
<body>

    <div id="coord-display">අලියාගේ ඇස මත Touch කරන්න...</div>

    <div id="game-container" id="area">
        <div id="test-pointer"></div>
    </div>

    <script>
        const area = document.getElementById('game-container');
        const display = document.getElementById('coord-display');
        const pointer = document.getElementById('test-pointer');

        area.addEventListener('click', function(e) {
            // Container එකේ ප්‍රමාණය සහ පිහිටීම ලබා ගැනීම
            const rect = area.getBoundingClientRect();
            
            // Touch/Click කල ස්ථානය px වලින්
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // ප්‍රතිශතයක් (Percentage) ලෙස හැරවීම
            const leftPct = (clickX / rect.width) * 100;
            const topPct = (clickY / rect.height) * 100;
            
            // Screen එකේ පෙන්වීම (දශමස්ථාන 1කට)
            display.innerHTML = `නියමිත Coordinates:<br>left: ${leftPct.toFixed(1)}% <br>top: ${topPct.toFixed(1)}%`;
            
            // Touch කල තැන රතු තිතක් තැබීම
            pointer.style.left = leftPct + '%';
            pointer.style.top = topPct + '%';
            pointer.style.display = 'block';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අලියාට ඇස තැබීම: AI Edition - SLSA - Korea</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    
    <style>
        :root { --gold: #ffcc00; --neon: #39ff14; --dark: #050505; --red: #ff1111; }
        
        body { 
            margin: 0; background: var(--dark); color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            min-height: 100vh; overflow: hidden; padding: 10px 0; box-sizing: border-box;
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        
        .main-logo-big { width: 120px; height: 120px; margin-bottom: 20px; }

        .start-btn { 
            padding: 20px 55px; background: var(--neon); color: #000; border: none; 
            border-radius: 45px; font-weight: bold; font-size: 1.4rem; cursor: pointer; 
            box-shadow: 0 0 25px var(--neon); transition: 0.3s; margin-bottom: 25px;
        }

        .instruction { color: var(--neon); font-size: 1.4rem; font-weight: bold; text-align: center; margin: 5px 0; }
        
        #game-container {
            position: relative; width: 80vw; max-width: 900px; height: 65vh; max-height: 600px;
            background: #fff url('image_2.png') no-repeat center;
            background-size: contain; border: 6px solid #444; border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* ඔබ සොයාගත් නිවැරදිම Coordinates මෙහි ඇතුළත් කර ඇත */
        #target {
            position: absolute;
            width: 22px; height: 22px;
            background: rgba(255, 204, 0, 0.2);
            border: 2px solid var(--gold);
            border-radius: 50%;
            top: 29.81%;  
            left: 30.32%; 
            transform: translate(-50%, -50%); 
            display: none; z-index: 50;
        }

        #user-mark {
            position: absolute; width: 45px; height: 45px;
            background: url('https://cdn-icons-png.flaticon.com/512/595/595053.png') no-repeat center;
            background-size: contain; transform: translate(-50%, -50%); display: none; z-index: 60;
        }

        #eye-cursor {
            position: absolute; width: 16px; height: 16px; 
            background-color: var(--red); border-radius: 50%;
            pointer-events: none; z-index: 100; display: none;
            box-shadow: 0 0 10px 4px rgba(255, 17, 17, 0.7);
            transform: translate(-50%, -50%);
        }

        #result-card {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.96);
            padding: 30px; border-radius: 20px; border: 3px solid var(--gold);
            text-align: center; z-index: 200; width: 80%; max-width: 450px;
        }

        .score-val { font-size: 4.5rem; color: var(--gold); font-weight: 900; display: block; margin-bottom: 10px; }
        
        #res-btn { 
            margin-top: 15px; padding: 14px 35px; background: var(--neon); color: #000; 
            border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
        }

        .branding-section { width: 100%; text-align: center; padding-bottom: 10px; }
        .dev-credit { color: #ffcc00; font-weight: bold; margin-top: 5px; font-size: 0.9rem; }
        #webcam { display: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="image_1.png" class="main-logo-big" alt="Logo">
        <h1 style="color:var(--gold); font-size: 2.5rem; margin: 10px 0;">අලියාට ඇස තැබීම: AI Edition</h1>
        <div style="color: #ddd; margin-bottom: 30px; padding: 0 20px; font-size: 1.1rem; line-height: 1.6;">
            දබර ඇඟිල්ලෙන් ඇස තැබිය යුතු ස්ථානය තෝරාගෙන,<br>
            එය තහවුරු කිරීමට <b>මහපට ඇඟිල්ල පසෙකට විහිදුවන්න (L-Gesture)</b>.
        </div>
        <button class="start-btn" onclick="startApp()">ක්‍රීඩාව අරඹන්න 🐘</button>
    </div>

    <div class="instruction" id="top-msg">සූදානම් වන්න...</div>

    <div id="game-container">
        <div id="target"></div>
        <div id="user-mark"></div>
        <div id="eye-cursor"></div>
        
        <div id="result-card">
            <h2 id="status-txt" style="color:#fff; margin:0;">ලකුණු මට්ටම</h2>
            <span class="score-val" id="score-pct">0%</span>
            <p id="dist-txt" style="color:#ccc; margin-bottom: 20px;"></p>
            <button id="res-btn" onclick="location.reload()">නැවත සෙල්ලම් කරන්න 🔄</button>
        </div>
        <video id="webcam" playsinline></video>
    </div>

    <div class="branding-section">
        <div style="font-size: 1.2rem; color: var(--gold); font-weight: bold;">SLSA - Korea</div>
        <div class="dev-credit">Developed by Indunil Samayamanthtree</div>
    </div>

    <script type="module">
        const eye = document.getElementById('eye-cursor');
        const target = document.getElementById('target');
        const userMark = document.getElementById('user-mark');
        const topMsg = document.getElementById('top-msg');
        const area = document.getElementById('game-container');
        const resultCard = document.getElementById('result-card');
        const videoElement = document.getElementById('webcam');

        let currentPhase = "loading"; 
        let lastX = 0, lastY = 0;
        let isDone = false;
        let gestureActive = false; 
        let triggerStartTime = null;

        window.startApp = function() {
            document.getElementById('splash-screen').style.display = 'none';
            initAI();
        }

        async function initAI() {
            topMsg.innerText = "කැමරාව සක්‍රීය වෙමින් පවතී...";
            try {
                const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                hands.setOptions({ 
                    maxNumHands: 1, 
                    modelComplexity: 1, 
                    minDetectionConfidence: 0.75, 
                    minTrackingConfidence: 0.75 
                });
                hands.onResults(onResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 640, height: 480
                });
                await camera.start();
                currentPhase = "play";
                topMsg.innerText = "ඇස තැබීමට දබර ඇඟිල්ල දිගු කර මහපට ඇඟිල්ල පසෙකට විහිදුවන්න!";
                setTimeout(() => { gestureActive = true; }, 1000);
            } catch(e) {
                topMsg.innerText = "Error: කැමරාව ක්‍රියාත්මක කළ නොහැක.";
            }
        }

        function onResults(results) {
            if (currentPhase !== "play" || isDone) return;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                eye.style.display = 'block';
                const hand = results.multiHandLandmarks[0];
                const indexTip = hand[8];  
                const indexMcp = hand[5];  
                const thumbTip = hand[4];  

                const x = (1 - indexTip.x) * area.offsetWidth;
                const y = indexTip.y * area.offsetHeight;
                eye.style.left = `${x}px`;
                eye.style.top = `${y}px`;
                lastX = x; lastY = y;

                if (gestureActive) {
                    // L-Gesture logic
                    const horizontalDist = Math.abs(thumbTip.x - indexMcp.x);
                    if (horizontalDist > 0.12) { 
                        if (!triggerStartTime) triggerStartTime = Date.now();
                        else if (Date.now() - triggerStartTime > 400) finalizeMark();
                    } else { triggerStartTime = null; }
                }
            } else { eye.style.display = 'none'; triggerStartTime = null; }
        }

        function finalizeMark() {
            if (isDone) return;
            isDone = true;
            target.style.display = 'block';
            userMark.style.left = `${lastX}px`;
            userMark.style.top = `${lastY}px`;
            userMark.style.display = 'block';

            const tx = target.offsetLeft;
            const ty = target.offsetTop;
            const dist = Math.sqrt(Math.pow(lastX - tx, 2) + Math.pow(lastY - ty, 2));
            
            // Score Logic (Adjusted for high precision)
            let score = Math.max(0, 100 - (dist / 2.0));
            if (dist < 8) score = 99.9; // ඉතාමත් ආසන්න නම්

            document.getElementById('score-pct').innerText = score.toFixed(1) + "%";
            document.getElementById('dist-txt').innerText = score > 90 ? "නියමයි! ඔබ හරියටම ඇස තැබුවා." : `පික්සල් ${dist.toFixed(0)} ක පරතරයක් ඇත.`;
            
            if(score > 90) document.getElementById('status-txt').innerText = "විශිෂ්ටයි! 🏆";
            else if(score > 60) document.getElementById('status-txt').innerText = "හොඳයි! 👍";
            else document.getElementById('status-txt').innerText = "තව උත්සාහ කරන්න 😅";

            resultCard.style.display = 'block';
            topMsg.innerText = "ක්‍රීඩාව අවසන්!";
        }
    </script>
</body>
</html>

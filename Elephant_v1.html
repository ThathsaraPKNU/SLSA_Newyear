<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; style-src * 'unsafe-inline'; font-src * data:;">
    <title>කිමේ බක්මහ උළෙල AI - Game Expert Edition</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    
    <style>
        :root { --gold: #ffcc00; --neon: #39ff14; --dark: #050505; --red: #ff3131; }
        body { 
            margin: 0; background: var(--dark); color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .start-btn { 
            padding: 18px 45px; background: var(--neon); color: #000; border: none; 
            border-radius: 40px; font-weight: bold; font-size: 1.2rem; cursor: pointer; 
            box-shadow: 0 0 20px var(--neon); transition: 0.3s; 
        }

        .instruction { color: var(--neon); font-size: 1.2rem; margin: 15px 10px; font-weight: bold; text-align: center; min-height: 1.5em; }
        
        #game-container {
            position: relative; width: 90vw; max-width: 480px; aspect-ratio: 1 / 1;
            background: #fff url('image_2.png') no-repeat center;
            background-size: contain; border: 5px solid #333; border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); overflow: hidden;
        }

        /* Target */
        #target {
            position: absolute; width: 32px; height: 32px;
            background: rgba(255, 204, 0, 0.6); border: 3px solid var(--gold);
            border-radius: 50%; top: 32.5%; left: 71.3%; 
            transform: translate(-50%, -50%); display: none; z-index: 50;
        }

        /* User's Mark */
        #user-mark {
            position: absolute; width: 42px; height: 42px;
            background: url('https://cdn-icons-png.flaticon.com/512/595/595053.png') no-repeat center;
            background-size: contain; transform: translate(-50%, -50%); display: none; z-index: 60;
        }

        /* Cursor */
        #eye-cursor {
            position: absolute; width: 45px; height: 45px;
            background: url('https://cdn-icons-png.flaticon.com/512/595/595053.png') no-repeat center;
            background-size: contain; pointer-events: none; z-index: 100; display: none;
            filter: drop-shadow(0 0 5px #000); transform: translate(-50%, -50%);
        }

        /* Game Phase Timers */
        #game-timer-bar {
            position: absolute; bottom: 0; left: 0; height: 10px;
            background: var(--gold); width: 100%; transition: width 1s linear;
        }

        /* Results Modal */
        #result-card {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.94);
            padding: 25px; border-radius: 15px; border: 2px solid var(--gold);
            text-align: center; z-index: 200; width: 85%; box-sizing: border-box;
        }

        .score-val { font-size: 3.5rem; color: var(--gold); font-weight: 900; display: block; margin: 10px 0; }
        
        #res-btn { 
            margin-top: 15px; padding: 12px 30px; background: var(--neon); color: #000; 
            border: none; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        .branding-section { width: 100%; text-align: center; padding: 20px 10px; }
        #webcam { display: none; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1 style="color:var(--gold); margin-bottom:5px;">කිමේ බක්මහ උළෙල - 2026</h1>
        <h2 style="color:var(--neon); margin-top:0;">AI අලියාට ඇස තැබීම</h2>
        <div style="padding: 0 30px; color: #ccc; max-width: 420px; line-height: 1.6; font-size: 1rem;">
            <b>පියවර 1:</b> තත්පර 5ක් ඇස තිබෙන තැන මතක තබා ගන්න.<br>
            <b>පියවර 2:</b> ඉන්පසු ක්‍රීඩකයාගේ ඇස් බඳින්න.<br>
            <b>පියවර 3:</b> තත්පර 15ක් ඇතුළත කැමරාවට ඇඟිල්ල පෙන්වා නිවැරදි තැනට ඇස ගෙන යන්න.
        </div>
        <br>
        <button class="start-btn" onclick="startApp()">ක්‍රීඩාව අරඹන්න 🐘</button>
    </div>

    <div class="instruction" id="top-msg">සූදානම් වන්න...</div>

    <div id="game-container">
        <div id="target"></div>
        <div id="user-mark"></div>
        <div id="eye-cursor"></div>
        <div id="game-timer-bar"></div>
        
        <div id="result-card">
            <h2 id="status-txt" style="margin:0; color:#fff;">ලකුණු මට්ටම</h2>
            <span class="score-val" id="score-pct">0%</span>
            <p id="dist-txt" style="color:#ccc; font-size: 0.95rem;"></p>
            <button id="res-btn" onclick="location.reload()">නැවත සෙල්ලම් කරන්න 🔄</button>
        </div>
        
        <video id="webcam" playsinline></video>
    </div>

    <div class="branding-section">
        <div style="font-size: 1.6rem; color: var(--gold); font-weight: 900;">කිමේ බක්මහ උළෙල - 2026</div>
        <div style="color: #bbb; letter-spacing: 1.5px; font-size: 0.9rem;">PRESENTED BY <b>VECTOR LABS & E9 SHOP</b></div>
    </div>

    <script type="module">
        const eye = document.getElementById('eye-cursor');
        const target = document.getElementById('target');
        const userMark = document.getElementById('user-mark');
        const topMsg = document.getElementById('top-msg');
        const area = document.getElementById('game-container');
        const timerBar = document.getElementById('game-timer-bar');
        const resultCard = document.getElementById('result-card');
        const videoElement = document.getElementById('webcam');

        let currentPhase = "loading"; 
        let timeLeft = 5;
        let lastX = 0, lastY = 0;
        let isDone = false;

        window.startApp = function() {
            document.getElementById('splash-screen').style.display = 'none';
            initAI();
        }

        async function initAI() {
            topMsg.innerText = "කැමරාව ක්‍රියාත්මක වෙමින් පවතී...";
            try {
                const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
                hands.onResults(onResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 480, height: 480
                });
                await camera.start();
                
                // Start Sight Phase
                startSightPhase();
            } catch (err) {
                topMsg.innerText = "කැමරාව ක්‍රියාත්මක කිරීමට නොහැකි විය.";
            }
        }

        function startSightPhase() {
            currentPhase = "sight";
            target.style.display = 'block'; // Show target for 5 seconds
            timeLeft = 5;
            topMsg.style.color = "var(--gold)";
            
            const sightTimer = setInterval(() => {
                topMsg.innerText = `ඇස තිබෙන තැන බලාගන්න: තත්පර ${timeLeft}`;
                let pct = (timeLeft / 5) * 100;
                timerBar.style.width = `${pct}%`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(sightTimer);
                    startBlindfoldPhase();
                }
            }, 1000);
        }

        function startBlindfoldPhase() {
            currentPhase = "play";
            target.style.display = 'none'; // Hide the target
            topMsg.style.color = "var(--neon)";
            topMsg.innerText = "දැන් ක්‍රීඩකයාගේ ඇස් බඳින්න! (Time: 15s)";
            
            timeLeft = 15;
            timerBar.style.background = "var(--neon)";

            const playTimer = setInterval(() => {
                topMsg.innerText = `ඇස තබන්න: තත්පර ${timeLeft} යි`;
                let pct = (timeLeft / 15) * 100;
                timerBar.style.width = `${pct}%`;
                timeLeft--;

                if (timeLeft < 0 || isDone) {
                    clearInterval(playTimer);
                    finalizeMark();
                }
            }, 1000);
        }

        function onResults(results) {
            if (currentPhase !== "play" || isDone) return;
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                eye.style.display = 'block';
                const tip = results.multiHandLandmarks[0][8]; 
                
                // Screen Mapping
                const x = (1 - tip.x) * area.offsetWidth;
                const y = tip.y * area.offsetHeight;

                eye.style.left = `${x}px`;
                eye.style.top = `${y}px`;

                lastX = x;
                lastY = y;
            } else {
                eye.style.display = 'none';
            }
        }

        function finalizeMark() {
            if (isDone) return;
            isDone = true;

            currentPhase = "result";
            timerBar.style.display = 'none';
            eye.style.display = 'none';
            
            // If the user didn't move the cursor at all, put it in center
            if(lastX === 0 && lastY === 0) {
                lastX = area.offsetWidth / 2;
                lastY = area.offsetHeight / 2;
            }

            // Reveal True Target and User Placement
            target.style.display = 'block';
            userMark.style.left = `${lastX}px`;
            userMark.style.top = `${lastY}px`;
            userMark.style.display = 'block';

            // Score Calculation
            const tx = target.offsetLeft;
            const ty = target.offsetTop;
            const dist = Math.sqrt(Math.pow(lastX - tx, 2) + Math.pow(lastY - ty, 2));
            
            let score = Math.max(0, 100 - (dist / 2.3));
            if (dist < 12) score = 100;

            document.getElementById('score-pct').innerText = score.toFixed(1) + "%";
            document.getElementById('dist-txt').innerText = `ඔබ නියමිත ස්ථානයට පික්සල් ${dist.toFixed(0)} ක් ආසන්නයි!`;

            if (score > 85) {
                document.getElementById('status-txt').innerText = "විශිෂ්ටයි! 🏆";
            } else if (score > 60) {
                document.getElementById('status-txt').innerText = "හොඳයි! 👍";
            } else {
                document.getElementById('status-txt').innerText = "තව උත්සාහ කරන්න 😅";
            }

            resultCard.style.display = 'block';
        }
    </script>
</body>
</html>

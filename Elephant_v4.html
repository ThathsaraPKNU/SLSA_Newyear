<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>අලියාට ඇස තැබීම: AI Edition - SLSA - Korea</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    
    <style>
        :root { 
            --gold: #ffcc00; --neon: #39ff14; --dark: #050505; --red: #ff1111; 
            --glass: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            margin: 0; background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); 
            color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            min-height: 100vh; overflow-x: hidden; padding: 10px 0; box-sizing: border-box;
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark); z-index: 1000; display: flex;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
            padding: 20px; box-sizing: border-box;
        }
        
        .main-logo-big { width: 100px; height: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.3)); }

        .start-btn { 
            padding: 15px 40px; background: var(--neon); color: #000; border: none; 
            border-radius: 50px; font-weight: 900; font-size: 1.2rem; cursor: pointer; 
            box-shadow: 0 0 20px var(--neon); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            margin-bottom: 20px; text-transform: uppercase;
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--neon); }

        .dev-credit-box {
            font-size: 1rem; color: var(--gold); font-weight: bold; letter-spacing: 1px;
            border: 2px solid var(--gold); padding: 8px 20px; border-radius: 35px;
            background: rgba(255, 204, 0, 0.1); backdrop-filter: blur(5px);
        }

        .instruction { color: var(--neon); font-size: 1.2rem; font-weight: bold; text-align: center; margin: 5px 0; padding: 0 10px; }
        
        #game-container {
            position: relative; width: 92vw; max-width: 600px; height: 50vh; max-height: 450px;
            background: #fff url('image_2.png') no-repeat center;
            background-size: contain; border: 4px solid #333; border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9); overflow: visible;
        }

        /* [යාවත්කාලීන කළා] ඔයා ලබාදුන් නිවැරදිම Coordinates අනුව සකස් කළ ඇසේ පිහිටීම */
        #target {
            position: absolute; width: 22px; height: 22px; background: rgba(255, 204, 0, 0.2);
            border: 2px solid var(--gold); border-radius: 50%; 
            top: 37.1%; 
            left: 26.1%; 
            transform: translate(-50%, -50%); display: none; z-index: 50; box-shadow: 0 0 15px var(--gold);
        }

        #user-mark {
            position: absolute; width: 18px; height: 18px;
            background: var(--red);
            border-radius: 50%; 
            box-shadow: 0 0 12px 5px rgba(255, 17, 17, 0.8);
            transform: translate(-50%, -50%); display: none; z-index: 60;
        }

        #eye-cursor {
            position: absolute; width: 18px; height: 18px; background-color: var(--red);
            border-radius: 50%; pointer-events: none; z-index: 100; display: none;
            box-shadow: 0 0 12px 5px rgba(255, 17, 17, 0.8); transform: translate(-50%, -50%);
        }

        /* මොබයිල් එකේ මැදටම එන පරිදි සකස් කළ Result Card එක */
        #result-card {
            display: none; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: rgba(0,0,0,0.95);
            padding: 25px; border-radius: 25px; border: 4px solid var(--gold);
            text-align: center; z-index: 200; width: 80%; max-width: 240px;
            box-shadow: 0 0 50px rgba(0,0,0,1); backdrop-filter: blur(10px);
        }

        .score-val { font-size: 3rem; color: var(--gold); font-weight: 900; display: block; margin: 5px 0; }
        #res-btn { margin-top: 15px; padding: 10px 30px; background: var(--neon); color: #000; border: none; border-radius: 35px; font-weight: 900; cursor: pointer; font-size: 1rem; }

        .branding-footer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-bottom: 5px; }
        .footer-main { display: flex; align-items: center; gap: 15px; }
        .bottom-logo { width: 50px; height: 50px; }
        .footer-text h2 { color: var(--gold); margin: 0; font-size: 1.2rem; font-weight: 900; }
        .footer-text p { margin: 2px 0 0 0; font-size: 0.9rem; color: #aaa; }
        #webcam { display: none; }
    </style>
</head>
<body>

    <audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <div id="splash-screen">
        <img src="image_1.png" class="main-logo-big">
        <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; padding: 0 10px;">ශ්‍රී ලාංකික ශිෂ්‍ය සංගමය - දකුණු කොරියාව</div>
        <h1 style="color:var(--gold); font-size: 2.5rem; margin: 5px 0; font-weight: 900;">අලියාට ඇස තැබීම</h1>
        <h2 style="color:var(--neon); margin: 0 0 25px 0; font-size: 1.5rem;">AI EDITION</h2>
        <button class="start-btn" onclick="startApp()">ක්‍රීඩාව අරඹන්න 🐘</button>
        <div class="dev-credit-box">Developed by Thathsara Nanayakkara</div>
    </div>

    <div class="instruction" id="top-msg">සූදානම් වන්න...</div>

    <div id="game-container">
        <div id="target"></div>
        <div id="user-mark"></div>
        <div id="eye-cursor"></div>
        <div id="result-card">
            <h2 id="status-txt" style="color:#fff; font-size: 1.1rem; margin: 0;">SCORE</h2>
            <span class="score-val" id="score-pct">0%</span>
            <button id="res-btn" onclick="location.reload()">RETRY 🔄</button>
        </div>
        <video id="webcam" playsinline></video>
    </div>

    <div class="branding-footer">
        <div class="footer-main">
            <img src="image_1.png" class="bottom-logo">
            <div class="footer-text">
                <h2>අලියාට ඇස තැබීම: AI Edition</h2>
                <p>SLSA - SOUTH KOREA</p>
            </div>
        </div>
        <div style="color: var(--gold); font-weight: bold; border-top: 1px solid #333; padding-top: 8px; width: 80%; max-width: 300px; text-align: center; font-size: 0.9rem;">
            Developed by Thathsara Nanayakkara
        </div>
    </div>

    <script type="module">
        const eye = document.getElementById('eye-cursor');
        const target = document.getElementById('target');
        const userMark = document.getElementById('user-mark');
        const topMsg = document.getElementById('top-msg');
        const area = document.getElementById('game-container');
        const resultCard = document.getElementById('result-card');
        const videoElement = document.getElementById('webcam');
        const popSound = document.getElementById('popSound');
        const winSound = document.getElementById('winSound');

        // අලියාගේ හැඩය (Polygon)
        const elephantPolygon = [
            {x: 19.16, y: 9.69}, {x: 17.36, y: 14.49}, {x: 17.26, y: 18.24}, {x: 14.56, y: 24.99}, {x: 14.86, y: 32.04}, 
            {x: 14.36, y: 38.79}, {x: 13.66, y: 49.44}, {x: 12.76, y: 56.04}, {x: 9.76, y: 62.04}, {x: 5.06, y: 68.79}, 
            {x: 5.16, y: 70.29}, {x: 7.96, y: 68.64}, {x: 11.76, y: 63.84}, {x: 13.46, y: 59.64}, {x: 13.46, y: 66.24}, 
            {x: 12.16, y: 68.79}, {x: 12.86, y: 69.84}, {x: 12.96, y: 73.44}, {x: 11.46, y: 82.44}, {x: 11.56, y: 87.84}, 
            {x: 14.66, y: 92.04}, {x: 17.86, y: 90.84}, {x: 19.16, y: 85.59}, {x: 17.76, y: 84.09}, {x: 16.36, y: 86.34}, 
            {x: 15.56, y: 84.84}, {x: 18.46, y: 72.84}, {x: 19.76, y: 63.69}, {x: 21.86, y: 59.34}, {x: 23.96, y: 51.69}, 
            {x: 25.16, y: 45.69}, {x: 27.26, y: 45.69}, {x: 29.46, y: 44.64}, {x: 31.16, y: 46.74}, {x: 30.46, y: 54.54}, 
            {x: 28.76, y: 68.04}, {x: 27.16, y: 84.39}, {x: 24.36, y: 89.79}, {x: 24.36, y: 91.89}, {x: 33.26, y: 92.64}, 
            {x: 33.96, y: 90.84}, {x: 32.66, y: 85.14}, {x: 34.56, y: 76.29}, {x: 42.06, y: 56.04}, {x: 43.16, y: 56.34}, 
            {x: 48.06, y: 79.89}, {x: 50.46, y: 84.99}, {x: 50.66, y: 88.14}, {x: 49.46, y: 92.04}, {x: 56.46, y: 92.94}, 
            {x: 59.06, y: 90.69}, {x: 58.06, y: 87.39}, {x: 56.16, y: 82.59}, {x: 54.46, y: 72.24}, {x: 54.06, y: 60.84}, 
            {x: 54.96, y: 59.19}, {x: 58.76, y: 60.99}, {x: 62.26, y: 60.99}, {x: 64.36, y: 61.44}, {x: 69.46, y: 65.04}, 
            {x: 70.66, y: 69.39}, {x: 69.76, y: 75.24}, {x: 65.26, y: 89.64}, {x: 67.56, y: 92.64}, {x: 73.76, y: 92.64}, 
            {x: 74.06, y: 91.74}, {x: 75.56, y: 75.84}, {x: 77.76, y: 69.24}, {x: 81.16, y: 77.34}, {x: 82.36, y: 84.84}, 
            {x: 81.46, y: 88.89}, {x: 81.06, y: 91.44}, {x: 90.26, y: 91.44}, {x: 90.36, y: 87.69}, {x: 86.86, y: 73.59}, 
            {x: 85.76, y: 68.64}, {x: 85.56, y: 62.04}, {x: 85.56, y: 54.69}, {x: 85.56, y: 49.44}, {x: 86.76, y: 43.74}, 
            {x: 87.86, y: 46.14}, {x: 88.36, y: 55.74}, {x: 89.56, y: 65.04}, {x: 90.96, y: 71.64}, {x: 91.56, y: 77.04}, 
            {x: 93.56, y: 80.79}, {x: 94.56, y: 77.94}, {x: 93.36, y: 74.04}, {x: 91.66, y: 69.39}, {x: 90.06, y: 62.94}, 
            {x: 89.46, y: 52.89}, {x: 88.86, y: 41.19}, {x: 88.26, y: 36.24}, {x: 85.46, y: 26.79}, {x: 81.16, y: 20.19}, 
            {x: 77.46, y: 15.24}, {x: 71.06, y: 10.44}, {x: 65.26, y: 8.49}, {x: 61.66, y: 8.64}, {x: 54.66, y: 8.64}, 
            {x: 49.16, y: 9.09}, {x: 42.26, y: 9.24}, {x: 39.16, y: 9.54}, {x: 36.36, y: 8.49}, {x: 32.76, y: 6.99}, 
            {x: 31.16, y: 7.44}, {x: 27.76, y: 7.44}, {x: 25.56, y: 7.59}, {x: 22.56, y: 7.44}, {x: 19.16, y: 9.09}
        ];

        let isDone = false;
        let gestureActive = false; 
        let triggerStartTime = null;

        window.startApp = function() {
            document.getElementById('splash-screen').style.display = 'none';
            initAI();
        }

        async function initAI() {
            topMsg.innerText = "Initializing AI Camera...";
            try {
                const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75, minTrackingConfidence: 0.75 });
                hands.onResults(onResults);
                const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 640, height: 480 });
                await camera.start();
                topMsg.innerText = "ඇස තැබීමට මහපට ඇඟිල්ල විහිදුවන්න!";
                gestureActive = true;
            } catch(e) { topMsg.innerText = "කැමරා දෝෂයකි!"; }
        }

        function isInside(x, y) {
            let inside = false;
            for (let i = 0, j = elephantPolygon.length - 1; i < elephantPolygon.length; j = i++) {
                let xi = elephantPolygon[i].x, yi = elephantPolygon[i].y;
                let xj = elephantPolygon[j].x, yj = elephantPolygon[j].y;
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function onResults(results) {
            if (isDone || !gestureActive) return;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                eye.style.display = 'block';
                const hand = results.multiHandLandmarks[0];
                const indexTip = hand[8]; const indexMcp = hand[5]; const thumbTip = hand[4];
                
                const x = (1 - indexTip.x) * area.offsetWidth;
                const y = indexTip.y * area.offsetHeight;
                eye.style.left = x + 'px'; eye.style.top = y + 'px';

                const thumbOpen = Math.abs(thumbTip.x - indexMcp.x) > 0.10;
                if (thumbOpen) {
                    if (!triggerStartTime) triggerStartTime = Date.now();
                    else if (Date.now() - triggerStartTime > 300) finalizeMark(x, y);
                } else { triggerStartTime = null; }
            } else { eye.style.display = 'none'; }
        }

        function finalizeMark(finalX, finalY) {
            isDone = true;
            popSound.play(); 
            
            target.style.display = 'block';
            userMark.style.left = finalX + 'px'; 
            userMark.style.top = finalY + 'px';
            userMark.style.display = 'block'; 
            eye.style.display = 'none';

            const xPct = (finalX / area.offsetWidth) * 100;
            const yPct = (finalY / area.offsetHeight) * 100;
            
            // [යාවත්කාලීන කළා] අලුත් Coordinatespx අනුව JavaScript scoring ලක්ෂ්‍යය ද නිවැරදි කළා
            const tx = area.offsetWidth * 0.261; /* left 26.1% */
            const ty = area.offsetHeight * 0.371; /* top 37.1% */
            const dist = Math.sqrt(Math.pow(finalX - tx, 2) + Math.pow(finalY - ty, 2));
            
            let score = 0;
            let status = "";

            if (isInside(xPct, yPct)) {
                // දුර අනුව ලකුණු දීම (මොබයිල් වලට ගැළපෙන සේ මනාව සකස් කර ඇත)
                score = Math.max(0, 100 - (dist * 0.35)); 
                if (dist < 12) score = 99.8; 
                winSound.play();
                status = "ON THE BODY! 🐘";
            } else {
                score = 0;
                status = "OUTSIDE! 😅";
            }

            if(score > 90) status = "EXCELLENT! 🏆";
            else if(score > 60) status = "GREAT SHOT! 👍";

            document.getElementById('status-txt').innerText = status;
            document.getElementById('score-pct').innerText = score.toFixed(1) + "%";
            resultCard.style.display = 'block';
            topMsg.innerText = "GAME OVER";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Elephant Outline Tool</title>
    <style>
        body { background: #0b0b0b; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        #canvas-container { 
            position: relative; display: inline-block; 
            border: 3px solid #333; box-shadow: 0 0 30px rgba(0,255,204,0.1);
        }
        canvas { display: block; cursor: crosshair; }
        img { display: none; }
        .controls { margin-top: 20px; }
        textarea { 
            width: 80%; height: 100px; background: #222; color: #39ff14; 
            border: 1px solid #444; padding: 10px; font-size: 14px;
        }
        button { padding: 10px 20px; background: #e74c3c; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>අලියාගේ ඇඟ වටේ Click කර Outline එක ලබාගන්න</h2>
    <div id="canvas-container">
        <canvas id="jungleCanvas"></canvas>
    </div>
    
    <div class="controls">
        <p>ලබාගත් ලකුණු ප්‍රමාණය: <span id="count">0</span></p>
        <textarea id="output" readonly placeholder="මෙහි Coordinates දිස්වනු ඇත..."></textarea><br><br>
        <button onclick="clearPoints()">Clear All Points</button>
    </div>

    <script>
        const canvas = document.getElementById('jungleCanvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        const countDisplay = document.getElementById('count');
        const img = new Image();
        img.src = 'image_2.png'; // පින්තූරයේ නම නිවැරදිදැයි බලන්න

        let points = [];

        img.onload = () => {
            canvas.width = 800; // Display size
            canvas.height = (img.height / img.width) * 800;
            draw();
        };

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / canvas.width * 100).toFixed(2);
            const y = ((e.clientY - rect.top) / canvas.height * 100).toFixed(2);
            
            points.push({ x: parseFloat(x), y: parseFloat(y) });
            updateOutput();
            draw();
        });

        function updateOutput() {
            const formatted = points.map(p => `{x: ${p.x}, y: ${p.y}}`).join(",\n");
            output.value = `[\n${formatted}\n]`;
            countDisplay.innerText = points.length;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Draw lines between points
            if (points.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#39ff14';
                ctx.lineWidth = 2;
                ctx.moveTo(points[0].x * canvas.width / 100, points[0].y * canvas.height / 100);
                
                points.forEach(p => {
                    const px = p.x * canvas.width / 100;
                    const py = p.y * canvas.height / 100;
                    ctx.lineTo(px, py);
                    ctx.fillStyle = '#ff1111';
                    ctx.fillRect(px - 2, py - 2, 4, 4);
                });
                
                if (points.length > 2) ctx.closePath();
                ctx.stroke();
            }
        }

        function clearPoints() {
            points = [];
            updateOutput();
            draw();
        }
    </script>
</body>
</html>
